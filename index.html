<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيد ميلاد رانيا ❤️</title>

<style>
body{
margin:0;
font-family:Tahoma;
background:linear-gradient(135deg,#ff5fa2,#7d5fff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
color:white;
text-align:center;
}

.card{
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:35px;
border-radius:25px;
width:90%;
max-width:500px;
box-shadow:0 0 30px rgba(0,0,0,.3);
animation:fade 1.5s;
}

h1{
font-size:40px;
margin-bottom:15px;
}

p{
font-size:22px;
line-height:1.8;
}

button{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:50px;
font-size:20px;
cursor:pointer;
background:white;
color:#ff2d75;
font-weight:bold;
}

#msg{
display:none;
margin-top:25px;
font-size:24px;
animation:fade 1s;
}

@keyframes fade{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="card">

<h1>🎂 كل عام وأنتِ بخير رانيا ❤️</h1>

<p>
اليوم مو مجرد عيد ميلاد...<br>
اليوم انولد أجمل إنسانة بحياتي.<br><br>

أتمنى أشوف ضحكتج دوم، وتحققين كل أحلامج،
وأبقى أول شخص يكولج كل عام وإنتِ بخير. 🌹
</p>

<button onclick="showLove()">
اضغطي هنا 🤍
</button>

<div id="msg">
أحبج هواي يا رانيا... وكل سنة وأنتِ أقرب إنسانة لقلبي ✨🩶
</div>

</div>

<script>
function showLove(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
